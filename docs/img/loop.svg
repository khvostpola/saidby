<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" role="img" aria-label="The improvement loop: run, review, teach the directory, run again">
<title>The improvement loop: run, review, teach the directory, run again</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #d5dcdc; }
  .box { fill: #f6fafa; stroke: #0e6170; stroke-width: 1.6; }
  .plain { fill: #f1f3f3; stroke: #8a9799; stroke-width: 1.4; }
  .warm { fill: #fff7e8; stroke: #b7791f; stroke-width: 1.6; }
  .good { fill: #eef8f1; stroke: #17703f; stroke-width: 1.6; }
  .optional { stroke-dasharray: 7 5; }
  .band { fill: #eef3f4; stroke: #c3cfd1; }
  .t { font: 600 14.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .s { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #4f5f63; }
  .h { font: 700 16px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .n { font: 12.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3b4a4e; }
  .tag { font: 600 10.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a5a00; }
  .line { stroke: #0e6170; stroke-width: 1.8; fill: none; }
  .dash { stroke: #8a9799; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  .head { fill: #0e6170; }
  .dhead { fill: #8a9799; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #12181b; }
    .frame { stroke: #2b373b; }
    .box { fill: #172327; stroke: #5cc3d1; }
    .plain { fill: #1b2225; stroke: #6c7b7e; }
    .warm { fill: #2a2314; stroke: #e0a93b; }
    .good { fill: #14261c; stroke: #5fd08e; }
    .band { fill: #182125; stroke: #2f3f44; }
    .t, .h { fill: #e8eceb; }
    .s { fill: #a3b1b4; }
    .n { fill: #c1ccce; }
    .tag { fill: #e0a93b; }
    .line { stroke: #5cc3d1; }
    .dash { stroke: #6c7b7e; }
    .head { fill: #5cc3d1; }
    .dhead { fill: #6c7b7e; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="bg" width="1080" height="420" rx="14"/>
<rect class="frame" x="0.5" y="0.5" width="1079" height="419" rx="14"/>
<text x="540" y="34" text-anchor="middle" class="h">A loop that makes the next run better</text>
<rect x="40" y="80" width="190" height="96" rx="10" class="box"/>
<text x="135.0" y="104" text-anchor="middle" class="t">1. Run</text>
<text x="135.0" y="123" text-anchor="middle" class="s">saidby process</text>
<text x="135.0" y="139" text-anchor="middle" class="s">--directory, --compare</text>
<rect x="310" y="80" width="210" height="96" rx="10" class="warm"/>
<text x="415.0" y="104" text-anchor="middle" class="t">2. Review</text>
<text x="415.0" y="123" text-anchor="middle" class="s">saidby review out/call</text>
<text x="415.0" y="139" text-anchor="middle" class="s">disagreements, rejected LLM</text>
<text x="415.0" y="155" text-anchor="middle" class="s">proposals, low-confidence words</text>
<rect x="600" y="80" width="200" height="96" rx="10" class="plain"/>
<text x="700.0" y="104" text-anchor="middle" class="t">3. You fix it</text>
<text x="700.0" y="123" text-anchor="middle" class="s">type the right text or</text>
<text x="700.0" y="139" text-anchor="middle" class="s">who spoke; Enter keeps</text>
<rect x="880" y="80" width="170" height="96" rx="10" class="good"/>
<text x="965.0" y="104" text-anchor="middle" class="t">4. Directory learns</text>
<text x="965.0" y="123" text-anchor="middle" class="s">new spellings become</text>
<text x="965.0" y="139" text-anchor="middle" class="s">variants (with backup)</text>
<path d="M230,128.0 L310,128.0" class="line" marker-end="url(#a)"/>
<path d="M520,128.0 L600,128.0" class="line" marker-end="url(#a)"/>
<path d="M800,128.0 L880,128.0" class="line" marker-end="url(#a)"/>
<path d="M965.0,176 L965.0,206 L135.0,206 L135.0,176" class="line" marker-end="url(#a)"/>
<text x="540" y="232" text-anchor="middle" class="s">the next run starts from a better directory</text>
<rect x="28" y="262" width="1024" height="130" rx="12" class="band"/>
<text x="44" y="284" text-anchor="start" class="h">Measuring, when you want to know whether it is better</text>
<text x="46" y="312" text-anchor="start" class="n">saidby eval score reference.txt out/call</text>
<text x="46" y="332" text-anchor="start" class="s">WER, directory terms spelled right, diarization error and speaker confusion against a hand-corrected stretch.</text>
<text x="46" y="358" text-anchor="start" class="n">saidby eval arbitrate-build / arbitrate-serve / arbitrate-score</text>
<text x="46" y="378" text-anchor="start" class="s">Listen blind to the spans where two systems disagree; get the WER difference with a 95% interval and a pre-set margin.</text>
</svg>
