<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="saidby pipeline: from a recording to a folder of results">
<title>saidby pipeline: from a recording to a folder of results</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #d5dcdc; }
  .box { fill: #f6fafa; stroke: #0e6170; stroke-width: 1.6; }
  .plain { fill: #f1f3f3; stroke: #8a9799; stroke-width: 1.4; }
  .warm { fill: #fff7e8; stroke: #b7791f; stroke-width: 1.6; }
  .good { fill: #eef8f1; stroke: #17703f; stroke-width: 1.6; }
  .optional { stroke-dasharray: 7 5; }
  .band { fill: #eef3f4; stroke: #c3cfd1; }
  .t { font: 600 14.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .s { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #4f5f63; }
  .h { font: 700 16px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .n { font: 12.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3b4a4e; }
  .tag { font: 600 10.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a5a00; }
  .line { stroke: #0e6170; stroke-width: 1.8; fill: none; }
  .dash { stroke: #8a9799; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  .head { fill: #0e6170; }
  .dhead { fill: #8a9799; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #12181b; }
    .frame { stroke: #2b373b; }
    .box { fill: #172327; stroke: #5cc3d1; }
    .plain { fill: #1b2225; stroke: #6c7b7e; }
    .warm { fill: #2a2314; stroke: #e0a93b; }
    .good { fill: #14261c; stroke: #5fd08e; }
    .band { fill: #182125; stroke: #2f3f44; }
    .t, .h { fill: #e8eceb; }
    .s { fill: #a3b1b4; }
    .n { fill: #c1ccce; }
    .tag { fill: #e0a93b; }
    .line { stroke: #5cc3d1; }
    .dash { stroke: #6c7b7e; }
    .head { fill: #5cc3d1; }
    .dhead { fill: #6c7b7e; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="bg" width="1080" height="470" rx="14"/>
<rect class="frame" x="0.5" y="0.5" width="1079" height="469" rx="14"/>
<text x="540" y="34" text-anchor="middle" class="h">From a recording to a folder of results</text>
<rect x="28" y="62" width="150" height="92" rx="10" class="plain"/>
<text x="103.0" y="86" text-anchor="middle" class="t">Recording</text>
<text x="103.0" y="105" text-anchor="middle" class="s">audio or video</text>
<text x="103.0" y="121" text-anchor="middle" class="s">anything ffmpeg reads</text>
<rect x="204" y="62" width="150" height="92" rx="10" class="box"/>
<text x="279.0" y="86" text-anchor="middle" class="t">ingest</text>
<text x="279.0" y="105" text-anchor="middle" class="s">ffmpeg</text>
<text x="279.0" y="121" text-anchor="middle" class="s">16 kHz mono WAV</text>
<rect x="380" y="62" width="150" height="92" rx="10" class="box"/>
<text x="455.0" y="86" text-anchor="middle" class="t">transcribe</text>
<text x="455.0" y="105" text-anchor="middle" class="s">faster-whisper large-v3</text>
<text x="455.0" y="121" text-anchor="middle" class="s">words + timestamps</text>
<rect x="556" y="62" width="150" height="92" rx="10" class="box optional"/>
<text x="631.0" y="76" text-anchor="middle" class="tag">WITH A DIRECTORY</text>
<text x="631.0" y="94" text-anchor="middle" class="t">bias + transplant</text>
<text x="631.0" y="113" text-anchor="middle" class="s">2nd pass: your terms</text>
<text x="631.0" y="129" text-anchor="middle" class="s">keeps the plain text</text>
<rect x="732" y="62" width="150" height="92" rx="10" class="box"/>
<text x="807.0" y="86" text-anchor="middle" class="t">diarize</text>
<text x="807.0" y="105" text-anchor="middle" class="s">Nemotron-3</text>
<text x="807.0" y="121" text-anchor="middle" class="s">who spoke, and when</text>
<rect x="908" y="62" width="150" height="92" rx="10" class="box optional"/>
<text x="983.0" y="76" text-anchor="middle" class="tag">WITH --compare</text>
<text x="983.0" y="94" text-anchor="middle" class="t">compare</text>
<text x="983.0" y="113" text-anchor="middle" class="s">a 2nd diarizer</text>
<text x="983.0" y="129" text-anchor="middle" class="s">where the two differ</text>
<rect x="28" y="196" width="150" height="92" rx="10" class="box optional"/>
<text x="103.0" y="210" text-anchor="middle" class="tag">WITH VOICEPRINTS</text>
<text x="103.0" y="228" text-anchor="middle" class="t">identify</text>
<text x="103.0" y="247" text-anchor="middle" class="s">voiceprints + consent</text>
<text x="103.0" y="263" text-anchor="middle" class="s">names the speakers</text>
<rect x="204" y="196" width="150" height="92" rx="10" class="box optional"/>
<text x="279.0" y="210" text-anchor="middle" class="tag">WITH --correct</text>
<text x="279.0" y="228" text-anchor="middle" class="t">correct</text>
<text x="279.0" y="247" text-anchor="middle" class="s">local LLM, strict limits</text>
<text x="279.0" y="263" text-anchor="middle" class="s">every change logged</text>
<rect x="380" y="196" width="150" height="92" rx="10" class="box"/>
<text x="455.0" y="220" text-anchor="middle" class="t">align</text>
<text x="455.0" y="239" text-anchor="middle" class="s">each word gets</text>
<text x="455.0" y="255" text-anchor="middle" class="s">its speaker</text>
<rect x="556" y="196" width="150" height="92" rx="10" class="box"/>
<text x="631.0" y="220" text-anchor="middle" class="t">tracks</text>
<text x="631.0" y="239" text-anchor="middle" class="s">one FLAC per speaker</text>
<text x="631.0" y="255" text-anchor="middle" class="s">same length as the call</text>
<rect x="732" y="196" width="326" height="92" rx="10" class="good"/>
<text x="895.0" y="220" text-anchor="middle" class="t">Results folder</text>
<text x="895.0" y="239" text-anchor="middle" class="s">transcript.txt  .vtt  .words.json</text>
<text x="895.0" y="255" text-anchor="middle" class="s">diarization.rttm  manifest.json  corrections.jsonl</text>
<path d="M178,108.0 L204,108.0" class="line" marker-end="url(#a)"/>
<path d="M354,108.0 L380,108.0" class="line" marker-end="url(#a)"/>
<path d="M530,108.0 L556,108.0" class="line" marker-end="url(#a)"/>
<path d="M706,108.0 L732,108.0" class="line" marker-end="url(#a)"/>
<path d="M882,108.0 L908,108.0" class="line" marker-end="url(#a)"/>
<path d="M178,242.0 L204,242.0" class="line" marker-end="url(#a)"/>
<path d="M354,242.0 L380,242.0" class="line" marker-end="url(#a)"/>
<path d="M530,242.0 L556,242.0" class="line" marker-end="url(#a)"/>
<path d="M706,242.0 L732,242.0" class="line" marker-end="url(#a)"/>
<path d="M983.0,154 L983.0,176 L103.0,176 L103.0,196" class="line" marker-end="url(#a)"/>
<rect x="28" y="326" width="1024" height="62" rx="12" class="band"/>
<text x="46" y="352" text-anchor="start" class="h">Directory</text>
<text x="150" y="352" text-anchor="start" class="n">people, voiceprints, terms and slang you maintain in one YAML file</text>
<text x="46" y="374" text-anchor="start" class="s">The stages with a dashed border read it (or --compare, --correct). The rest needs no setup.</text>
<rect x="28" y="404" width="1024" height="44" rx="12" class="band"/>
<text x="46" y="431" text-anchor="start" class="n">Models are downloaded once with  saidby models pull  and processing never opens a network connection.</text>
</svg>
