<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430" role="img" aria-label="How saidby gets your names and terms right">
<title>How saidby gets your names and terms right</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #d5dcdc; }
  .box { fill: #f6fafa; stroke: #0e6170; stroke-width: 1.6; }
  .plain { fill: #f1f3f3; stroke: #8a9799; stroke-width: 1.4; }
  .warm { fill: #fff7e8; stroke: #b7791f; stroke-width: 1.6; }
  .good { fill: #eef8f1; stroke: #17703f; stroke-width: 1.6; }
  .optional { stroke-dasharray: 7 5; }
  .band { fill: #eef3f4; stroke: #c3cfd1; }
  .t { font: 600 14.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .s { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #4f5f63; }
  .h { font: 700 16px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .n { font: 12.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3b4a4e; }
  .tag { font: 600 10.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a5a00; }
  .line { stroke: #0e6170; stroke-width: 1.8; fill: none; }
  .dash { stroke: #8a9799; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  .head { fill: #0e6170; }
  .dhead { fill: #8a9799; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #12181b; }
    .frame { stroke: #2b373b; }
    .box { fill: #172327; stroke: #5cc3d1; }
    .plain { fill: #1b2225; stroke: #6c7b7e; }
    .warm { fill: #2a2314; stroke: #e0a93b; }
    .good { fill: #14261c; stroke: #5fd08e; }
    .band { fill: #182125; stroke: #2f3f44; }
    .t, .h { fill: #e8eceb; }
    .s { fill: #a3b1b4; }
    .n { fill: #c1ccce; }
    .tag { fill: #e0a93b; }
    .line { stroke: #5cc3d1; }
    .dash { stroke: #6c7b7e; }
    .head { fill: #5cc3d1; }
    .dhead { fill: #6c7b7e; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="bg" width="1080" height="430" rx="14"/>
<rect class="frame" x="0.5" y="0.5" width="1079" height="429" rx="14"/>
<text x="540" y="34" text-anchor="middle" class="h">How your names and terms end up spelled right</text>
<rect x="28" y="70" width="190" height="96" rx="10" class="plain"/>
<text x="123.0" y="94" text-anchor="middle" class="t">Plain pass</text>
<text x="123.0" y="113" text-anchor="middle" class="s">the recognizer as it is</text>
<text x="123.0" y="129" text-anchor="middle" class="s">faithful to what is said</text>
<text x="123.0" y="145" text-anchor="middle" class="s">but terms come out garbled</text>
<rect x="28" y="200" width="190" height="96" rx="10" class="warm"/>
<text x="123.0" y="224" text-anchor="middle" class="t">Biased pass</text>
<text x="123.0" y="243" text-anchor="middle" class="s">same audio, with your terms</text>
<text x="123.0" y="259" text-anchor="middle" class="s">as hotwords</text>
<text x="123.0" y="275" text-anchor="middle" class="s">finds terms, can derail</text>
<rect x="284" y="126" width="190" height="96" rx="10" class="box"/>
<text x="379.0" y="150" text-anchor="middle" class="t">Transplant</text>
<text x="379.0" y="169" text-anchor="middle" class="s">keeps the plain text and</text>
<text x="379.0" y="185" text-anchor="middle" class="s">takes only the spans where</text>
<text x="379.0" y="201" text-anchor="middle" class="s">the biased pass wrote a term</text>
<rect x="540" y="126" width="170" height="96" rx="10" class="box"/>
<text x="625.0" y="150" text-anchor="middle" class="t">Slang unified</text>
<text x="625.0" y="169" text-anchor="middle" class="s">variants of dialect terms</text>
<text x="625.0" y="185" text-anchor="middle" class="s">become one spelling</text>
<rect x="776" y="70" width="276" height="104" rx="10" class="box optional"/>
<text x="914.0" y="84" text-anchor="middle" class="tag">WITH --correct</text>
<text x="914.0" y="102" text-anchor="middle" class="t">Optional LLM pass</text>
<text x="914.0" y="121" text-anchor="middle" class="s">proposes replacing 1 to 3 words</text>
<text x="914.0" y="137" text-anchor="middle" class="s">with a term from your directory</text>
<text x="914.0" y="153" text-anchor="middle" class="s">a local llama-server, off by default</text>
<rect x="776" y="196" width="276" height="108" rx="10" class="warm"/>
<text x="914.0" y="220" text-anchor="middle" class="t">Guardrails (in code)</text>
<text x="914.0" y="239" text-anchor="middle" class="s">only directory terms or variants</text>
<text x="914.0" y="255" text-anchor="middle" class="s">the original must resemble the term</text>
<text x="914.0" y="271" text-anchor="middle" class="s">overlaps and truncated replies dropped</text>
<text x="914.0" y="287" text-anchor="middle" class="s">timestamps are never touched</text>
<rect x="284" y="260" width="426" height="76" rx="10" class="good"/>
<text x="497.0" y="284" text-anchor="middle" class="t">Final transcript + corrections.jsonl</text>
<text x="497.0" y="303" text-anchor="middle" class="s">every change: when, from, to, who made it</text>
<text x="497.0" y="319" text-anchor="middle" class="s">(bias, dialect, llm, review) and why a proposal was rejected</text>
<path d="M218,118.0 L284,174.0" class="line" marker-end="url(#a)"/>
<path d="M218,248.0 L284,174.0" class="line" marker-end="url(#a)"/>
<path d="M474,174.0 L540,174.0" class="line" marker-end="url(#a)"/>
<path d="M710,174.0 L776,122.0" class="line" marker-end="url(#a)"/>
<path d="M914.0,174 L914.0,196" class="line" marker-end="url(#a)"/>
<path d="M776,250.0 L730,250.0 L730,298.0 L710,298.0" class="line" marker-end="url(#a)"/>
<path d="M625.0,222 L625.0,260" class="line" marker-end="url(#a)"/>
<rect x="28" y="352" width="1024" height="56" rx="12" class="band"/>
<text x="46" y="376" text-anchor="start" class="h">Measured on one 15-minute call:</text>
<text x="352" y="376" text-anchor="start" class="n">terms spelled right 36% with the plain pass, 59% after the transplant (docs/benchmarks.md).</text>
<text x="46" y="396" text-anchor="start" class="s">Hotwords alone are fragile (they can make the recognizer skip passages), which is why saidby never trusts the biased pass for the text.</text>
</svg>
