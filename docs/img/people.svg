<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 408" width="1080" height="408" role="img" aria-label="How saidby learns who is speaking">
<title>How saidby learns who is speaking</title>

<style>
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #d5dcdc; }
  .box { fill: #f6fafa; stroke: #0e6170; stroke-width: 1.6; }
  .plain { fill: #f1f3f3; stroke: #8a9799; stroke-width: 1.4; }
  .warm { fill: #fff7e8; stroke: #b7791f; stroke-width: 1.6; }
  .good { fill: #eef8f1; stroke: #17703f; stroke-width: 1.6; }
  .optional { stroke-dasharray: 7 5; }
  .band { fill: #eef3f4; stroke: #c3cfd1; }
  .t { font: 600 14.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .s { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #4f5f63; }
  .h { font: 700 16px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #141819; }
  .n { font: 12.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #3b4a4e; }
  .tag { font: 600 10.5px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #8a5a00; }
  .line { stroke: #0e6170; stroke-width: 1.8; fill: none; }
  .dash { stroke: #8a9799; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  .head { fill: #0e6170; }
  .dhead { fill: #8a9799; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #12181b; }
    .frame { stroke: #2b373b; }
    .box { fill: #172327; stroke: #5cc3d1; }
    .plain { fill: #1b2225; stroke: #6c7b7e; }
    .warm { fill: #2a2314; stroke: #e0a93b; }
    .good { fill: #14261c; stroke: #5fd08e; }
    .band { fill: #182125; stroke: #2f3f44; }
    .t, .h { fill: #e8eceb; }
    .s { fill: #a3b1b4; }
    .n { fill: #c1ccce; }
    .tag { fill: #e0a93b; }
    .line { stroke: #5cc3d1; }
    .dash { stroke: #6c7b7e; }
    .head { fill: #5cc3d1; }
    .dhead { fill: #6c7b7e; }
  }
</style>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dhead"/></marker>
</defs>
<rect class="bg" width="1080" height="408" rx="14"/>
<rect class="frame" x="0.5" y="0.5" width="1079" height="407" rx="14"/>
<text x="540" y="34" text-anchor="middle" class="h">Naming the speakers, with consent</text>
<rect x="28" y="56" width="500" height="196" rx="12" class="band"/>
<text x="44" y="78" text-anchor="start" class="h">1. Enroll once</text>
<rect x="48" y="100" width="140" height="80" rx="10" class="plain"/>
<text x="118.0" y="124" text-anchor="middle" class="t">A finished run</text>
<text x="118.0" y="143" text-anchor="middle" class="s">SPEAKER_00,</text>
<text x="118.0" y="159" text-anchor="middle" class="s">SPEAKER_01</text>
<rect x="214" y="100" width="140" height="80" rx="10" class="warm"/>
<text x="284.0" y="124" text-anchor="middle" class="t">Consent</text>
<text x="284.0" y="143" text-anchor="middle" class="s">recorded in</text>
<text x="284.0" y="159" text-anchor="middle" class="s">consent.yaml</text>
<rect x="380" y="100" width="128" height="80" rx="10" class="good"/>
<text x="444.0" y="124" text-anchor="middle" class="t">Voiceprint</text>
<text x="444.0" y="143" text-anchor="middle" class="s">a vector, never</text>
<text x="444.0" y="159" text-anchor="middle" class="s">audio</text>
<path d="M188,140.0 L214,140.0" class="line" marker-end="url(#a)"/>
<path d="M354,140.0 L380,140.0" class="line" marker-end="url(#a)"/>
<text x="48" y="214" text-anchor="start" class="s">saidby enroll out/call --speaker SPEAKER_00=ana --directory directory.yaml</text>
<text x="48" y="236" text-anchor="start" class="s">No consent record, no voiceprint (exit code 5).</text>
<rect x="552" y="56" width="500" height="196" rx="12" class="band"/>
<text x="568" y="78" text-anchor="start" class="h">2. Every later run</text>
<rect x="572" y="100" width="140" height="80" rx="10" class="plain"/>
<text x="642.0" y="124" text-anchor="middle" class="t">Voice sample</text>
<text x="642.0" y="143" text-anchor="middle" class="s">longest clean turns,</text>
<text x="642.0" y="159" text-anchor="middle" class="s">up to 60 s per speaker</text>
<rect x="738" y="100" width="128" height="80" rx="10" class="box"/>
<text x="802.0" y="124" text-anchor="middle" class="t">Compare</text>
<text x="802.0" y="143" text-anchor="middle" class="s">cosine similarity</text>
<text x="802.0" y="159" text-anchor="middle" class="s">to each voiceprint</text>
<rect x="892" y="100" width="140" height="80" rx="10" class="good"/>
<text x="962.0" y="124" text-anchor="middle" class="t">Names</text>
<text x="962.0" y="143" text-anchor="middle" class="s">one person per</text>
<text x="962.0" y="159" text-anchor="middle" class="s">speaker, at most</text>
<path d="M712,140.0 L738,140.0" class="line" marker-end="url(#a)"/>
<path d="M866,140.0 L892,140.0" class="line" marker-end="url(#a)"/>
<text x="572" y="214" text-anchor="start" class="s">A name is assigned only if the similarity is at least 0.5</text>
<text x="572" y="236" text-anchor="start" class="s">and the speaker has at least 3 s of speech. Otherwise: SPEAKER_nn.</text>
<rect x="28" y="272" width="1024" height="116" rx="12" class="band"/>
<text x="44" y="294" text-anchor="start" class="h">Fixing what the machine got wrong, without reprocessing audio</text>
<text x="46" y="316" text-anchor="start" class="n">saidby speakers map out/call --set SPEAKER_01=ben</text>
<text x="46" y="336" text-anchor="start" class="s">rename a speaker</text>
<text x="500" y="316" text-anchor="start" class="n">saidby speakers merge out/call SPEAKER_02 --into SPEAKER_00</text>
<text x="500" y="336" text-anchor="start" class="s">join a person the diarizer split in two</text>
<text x="46" y="366" text-anchor="start" class="s">Both rewrite the transcript, subtitles, RTTM, tracks and manifest, and record the edit in manifest.json.</text>
</svg>
