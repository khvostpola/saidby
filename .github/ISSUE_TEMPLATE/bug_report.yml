name: Bug report
description: Something does not work as documented
body:
  - type: input
    id: version
    attributes:
      label: saidby version
      description: Output of `saidby --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `saidby doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not attach private recordings or transcripts. Redact logs if they contain names.
