name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_TORCH_BACKEND: cpu
  PYANNOTE_METRICS_ENABLED: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra pyannote --extra eval
      - run: uv run mypy
      - run: uv run mypy --platform win32

  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - run: uv run --no-sync python tools/third_party_notices.py --check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.13"
    continue-on-error: ${{ matrix.python == '3.13' }}
    defaults:
      run:
        shell: bash
    env:
      CI_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Keep the model cache in a per-runner folder
        run: echo "HF_HOME=$RUNNER_TEMP/hf" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --extra pyannote --extra eval
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hf/hub
          key: hf-${{ runner.os }}-${{ hashFiles('src/saidby/models/registry.py') }}
      - name: Pull test models (network allowed here only)
        run: uv run saidby models pull asr:tiny
      - name: Run tests offline
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -m "not gpu" --cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv run --isolated --no-project --with dist/*.whl -- saidby --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "missing Signed-off-by: $sha"
              missing=1
            fi
          done
          exit $missing
