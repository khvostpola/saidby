name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  UV_TORCH_BACKEND: cpu
  PYANNOTE_METRICS_ENABLED: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy

  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - run: uv run --no-sync python tools/third_party_notices.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    continue-on-error: ${{ matrix.python == '3.13' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ hashFiles('src/saidby/models/registry.py') }}
      - name: Pull test models (network allowed here only)
        run: uv run saidby models pull asr:tiny
      - name: Run tests offline
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -m "not gpu" --cov

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv run --isolated --no-project --with dist/*.whl -- saidby --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "missing Signed-off-by: $sha"
              missing=1
            fi
          done
          exit $missing
