allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "PSF-2.0", "MPL-2.0",
  "Unlicense", "0BSD", "HPND", "Python-2.0", "BSL-1.0", "CC0-1.0", "MIT-0", "Zlib", "CNRI-Python", "LLVM-exception",
]

[aliases]
"Apache Software License" = "Apache-2.0"
"Apache 2.0" = "Apache-2.0"
"Apache License 2.0" = "Apache-2.0"
"Apache License, Version 2.0" = "Apache-2.0"
"MIT License" = "MIT"
"BSD License" = "BSD-3-Clause"
"BSD" = "BSD-3-Clause"
"BSD 3-Clause" = "BSD-3-Clause"
"BSD-3-Clause License" = "BSD-3-Clause"
"Mozilla Public License 2.0 (MPL 2.0)" = "MPL-2.0"
"Python Software Foundation License" = "PSF-2.0"
"ISC License (ISCL)" = "ISC"

"3-Clause BSD License" = "BSD-3-Clause"
"BSD 3-Clause License" = "BSD-3-Clause"
"ISC License" = "ISC"
"Apache 2.0 License" = "Apache-2.0"

[exceptions]
# Reviewed packages whose metadata is missing or not an SPDX id: name -> rationale
"nvidia-*" = "NVIDIA proprietary redistributable EULA; installed from PyPI, never redistributed by saidby"
"cuda-toolkit" = "Meta-package for NVIDIA CUDA wheels; installed from PyPI, never redistributed by saidby"
"av" = "BSD-3-Clause bindings; wheels bundle FFmpeg with GPL components; pulled by faster-whisper, never imported by saidby"
"soxr" = "LGPL-2.1-or-later resampler pulled by librosa; installed from PyPI as a separate library, unmodified and never redistributed by saidby"
