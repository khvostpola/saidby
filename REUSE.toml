version = 1

[[annotations]]
path = [
  "**/*.md", "**/*.toml", "**/*.json", "**/*.yml", "**/*.yaml", ".gitignore", ".gitattributes",
  ".editorconfig", ".python-version", "uv.lock", "py.typed", "src/saidby/py.typed",
  ".github/CODEOWNERS", "NOTICE", "LICENSE", "src/saidby/evaluation/arbitrate.html",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 the saidby authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["fixtures/synthetic/**", "fixtures/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 the saidby authors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant authors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["fixtures/conversations/**", "fixtures/MANIFEST.json", "fixtures/ATTRIBUTION.md"]
precedence = "override"
SPDX-FileCopyrightText = "Multilingual LibriSpeech authors and LibriVox readers"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["docs/img/logo.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 the saidby authors"
SPDX-License-Identifier = "CC0-1.0"
